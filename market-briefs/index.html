<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Market Brief Archive</title>
<style>
:root{--bg:#0b1115;--panel:#162027;--panel2:#1c2930;--line:#364a53;--text:#f3f6f7;--muted:#aebdc3;--green:#7bc89c;--amber:#d8b86f;--blue:#84b4c9}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#091015,#10191e);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}.wrap{max-width:860px;margin:auto;padding:16px 12px 40px}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px}.hero{padding:22px;background:linear-gradient(145deg,#1c2930,#121c22)}.ey{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:.12em}h1{font-size:27px;line-height:1.15;margin:7px 0 8px}h2{font-size:17px;margin:0}.sub,.meta,.status{font-size:12px;color:var(--muted)}.toprow{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.count{font-size:34px;font-weight:850}.toolbar{margin:14px 0;display:grid;grid-template-columns:1fr;gap:9px}.search{width:100%;border:1px solid var(--line);background:#111a1f;color:var(--text);border-radius:14px;padding:12px 14px;font-size:15px;outline:none}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#1a272d;color:#dce5e8;border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}.chip.active{border-color:#7596a5;background:#263841;color:white}.panel{padding:15px;margin-top:10px}.item{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid rgba(255,255,255,.08)}.item:last-child{border-bottom:0}.date{font-size:12px;color:var(--blue);font-weight:800}.title{font-size:15px;font-weight:750}.kind{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#24333a;color:#cbd7db;margin-top:4px}.open{display:inline-flex;text-decoration:none;color:#0b1115;background:#d7e1e4;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:800;white-space:nowrap}.empty{padding:24px 8px;text-align:center;color:var(--muted)}.foot{margin-top:18px;font-size:11px;color:#829198}.repo{color:#a8c9d7;text-decoration:none}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.d1{background:var(--amber)}.d2{background:var(--green)}.d3{background:var(--blue)}
@media(max-width:620px){h1{font-size:23px}.item{grid-template-columns:76px 1fr}.open{grid-column:2;justify-self:start}.count{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <div class="ey">MARKET BRIEF ARCHIVE</div>
  <div class="toprow"><div><h1>시장 브리핑 아카이브</h1><div class="sub">야간 · 오전 6시 · 오전 9시 HTML 브리핑을 날짜별로 자동 모아봅니다.</div></div><div><div class="count" id="count">—</div><div class="meta">저장된 브리핑</div></div></div>
  <div class="legend"><span><i class="dot d1"></i>야간</span><span><i class="dot d2"></i>오전 6시</span><span><i class="dot d3"></i>오전 9시</span></div>
</section>

<div class="toolbar">
  <input id="search" class="search" placeholder="날짜 또는 브리핑 종류 검색" aria-label="검색">
  <div class="chips">
    <button class="chip active" data-filter="all">전체</button>
    <button class="chip" data-filter="night">야간</button>
    <button class="chip" data-filter="morning0600">오전 6시</button>
    <button class="chip" data-filter="morning0900">오전 9시</button>
  </div>
</div>

<section class="panel">
  <div class="toprow"><h2>브리핑 목록</h2><div id="status" class="status">GitHub에서 불러오는 중…</div></div>
  <div id="list"><div class="empty">목록을 불러오는 중입니다.</div></div>
</section>

<div class="foot">저장소: <a class="repo" href="https://github.com/hero1356-kor/stock-broadcast-catchup/tree/main/market-briefs">hero1356-kor/stock-broadcast-catchup › market-briefs</a><br>목록은 공개 GitHub API에서 읽어오므로 새 브리핑이 저장되면 이 페이지에도 자동으로 나타납니다.</div>
</div>
<script>
const owner='hero1356-kor',repo='stock-broadcast-catchup',base='market-briefs';
let all=[],filter='all';
const api=p=>`https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=main`;
const view=p=>`https://raw.githack.com/${owner}/${repo}/main/${p}`;
async function walk(path){const r=await fetch(api(path),{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub API '+r.status);const items=await r.json();let out=[];for(const x of items){if(x.type==='dir')out=out.concat(await walk(x.path));else if(x.name.endsWith('.html')&&x.name!=='index.html'&&x.name!=='persistence-test.html')out.push(x)}return out}
function info(x){let kind='night',label='야간 브리핑';if(x.path.includes('/morning-0600/')){kind='morning0600';label='오전 6시 브리핑'}else if(x.path.includes('/morning-0900/')){kind='morning0900';label='오전 9시 브리핑'}const m=x.name.match(/(20\d{2})-(\d{2})-(\d{2})(?:-(\d{4}))?/);const date=m?`${m[1]}.${m[2]}.${m[3]}`:'날짜 미상';const time=m&&m[4]?`${m[4].slice(0,2)}:${m[4].slice(2)}`:'';return{...x,kind,label,date,time,sort:m?(m[1]+m[2]+m[3]+(m[4]||'0000')):''}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const rows=all.filter(x=>(filter==='all'||x.kind===filter)&&(`${x.date} ${x.time} ${x.label} ${x.name}`).toLowerCase().includes(q));document.getElementById('count').textContent=all.length;document.getElementById('status').textContent=`${rows.length}개 표시`;document.getElementById('list').innerHTML=rows.length?rows.map(x=>`<div class="item"><div class="date">${x.date}<br>${x.time}</div><div><div class="title">${x.label}</div><span class="kind">${x.kind==='night'?'NIGHT':x.kind==='morning0600'?'06:00':'09:00'}</span></div><a class="open" href="${view(x.path)}">열기</a></div>`).join(''):'<div class="empty">조건에 맞는 브리핑이 없습니다.</div>'}
document.getElementById('search').addEventListener('input',render);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
(async()=>{try{all=(await walk(base)).map(info).sort((a,b)=>b.sort.localeCompare(a.sort));render()}catch(e){document.getElementById('status').textContent='목록 불러오기 실패';document.getElementById('list').innerHTML='<div class="empty">GitHub API에서 목록을 가져오지 못했습니다.<br>아래 저장소 링크에서 직접 확인할 수 있습니다.</div>';}})();
</script>
</body></html>
